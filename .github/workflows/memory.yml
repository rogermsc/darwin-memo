name: Memory

# The dogfood loop: this repo's own lesson store, settled by this
# repo's own test suite. Agents consult .darwin-memo/lessons.json via
# ledger.decide() while working, record the ticket id in the PR body
# as `darwin-memo-ticket: <id>`, and this workflow settles the ticket
# when the PR merges: junit XML from the base and merge commits,
# diffed per test id by rogermsc/darwin-memo-action, the published
# wrapper around `darwin-memo settle-ci`. Lessons that keep shipping
# green survive; lessons that keep breaking builds die. Nobody
# reviews the store. docs/integrations/ci-lesson-store.md is the
# general wiring guide this instantiates.

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

# One settler at a time: the store is a single JSON file guarded only
# by an advisory lock (lesson 9 in the store, consulted when this
# file was written).
concurrency:
  group: darwin-memo-settle
  cancel-in-progress: false

jobs:
  settle:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,mcp]"
      - name: Run the suite at base and merge, per test
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          report() {
            git checkout -q "$1"
            # Failing tests are data, not a step failure; a run that
            # measured nothing leaves no XML and settle-ci abstains.
            pytest -q --tb=no -p no:cacheprovider --junitxml "$2" || true
          }
          report "$BASE_SHA" /tmp/base.xml
          report "$MERGE_SHA" /tmp/head.xml
          git checkout -q main
      - name: Settle tickets and tick
        id: settle
        uses: rogermsc/darwin-memo-action@v1
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        with:
          junit-base: /tmp/base.xml
          junit-head: /tmp/head.xml
          scale: "2.0"
          # The repo commits the store itself to keep the PR number
          # in the message; the action would use a generic one.
          commit-store: "false"
      - name: Commit the store back to main
        if: steps.settle.outputs.result == 'settled'
        run: |
          git config user.name "darwin-memo-settler"
          git config user.email "actions@users.noreply.github.com"
          git add .darwin-memo/lessons.json .darwin-memo/flaky.json
          if ! git diff --cached --quiet; then
            git commit -m "memory: settle and tick after PR #${{ github.event.pull_request.number }}"
            git push origin main
          fi
