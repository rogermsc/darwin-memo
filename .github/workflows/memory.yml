name: Memory

# The dogfood loop: this repo's own lesson store, settled by this
# repo's own test suite. Agents consult .darwin-memo/lessons.json via
# ledger.decide() while working, record the ticket id in the PR body
# as `darwin-memo-ticket: <id>`, and this workflow settles the ticket
# when the PR merges: junit XML from the base and merge commits,
# diffed per test id by `darwin-memo settle-ci`. Lessons that keep
# shipping green survive; lessons that keep breaking builds die.
# Nobody reviews the store. docs/integrations/ci-lesson-store.md is
# the general wiring guide this instantiates.

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

# One settler at a time: the store is a single JSON file with no
# locking (lesson 9 in the store, consulted when this file was written).
concurrency:
  group: darwin-memo-settle
  cancel-in-progress: false

jobs:
  settle:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Run the suite at base and merge, per test
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          report() {
            git checkout -q "$1"
            # Failing tests are data, not a step failure; a run that
            # measured nothing leaves no XML and settle-ci abstains.
            pytest -q --tb=no -p no:cacheprovider --junitxml "$2" || true
          }
          report "$BASE_SHA" /tmp/base.xml
          report "$MERGE_SHA" /tmp/head.xml
          git checkout -q main
      - name: Settle tickets and tick
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          darwin-memo settle-ci .darwin-memo/lessons.json \
            --base-xml /tmp/base.xml --head-xml /tmp/head.xml \
            --scale 2.0 --detail "$RUN_URL"
      - name: Commit the store back to main
        run: |
          git config user.name "darwin-memo-settler"
          git config user.email "actions@users.noreply.github.com"
          git add .darwin-memo/lessons.json .darwin-memo/flaky.json
          if ! git diff --cached --quiet; then
            git commit -m "memory: settle and tick after PR #${{ github.event.pull_request.number }}"
            git push origin main
          fi
