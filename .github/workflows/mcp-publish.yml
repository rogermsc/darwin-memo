name: MCP Registry

# Publishes server.json to the official MCP registry
# (registry.modelcontextprotocol.io) under io.github.rogermsc.
#
# PRs only validate. The real publish runs on release tags (after
# release.yml has pushed the matching version to PyPI; the registry
# verifies ownership by finding the `mcp-name:` marker in the PyPI
# README, so the package must exist first) and on manual dispatch
# from main.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  pull_request:
    paths:
      - server.json
      - .github/workflows/mcp-publish.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - run: ./mcp-publisher validate

  publish:
    # rc tags go to TestPyPI only (see release.yml) and the registry
    # accepts packages from pypi.org alone, so rc tags never publish.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, 'rc'))
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC token for mcp-publisher login github-oidc
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' \
            server.json > server.tmp && mv server.tmp server.json
      - name: Wait for the package on PyPI
        run: |
          VERSION="$(jq -r .version server.json)"
          echo "waiting for darwin-memo $VERSION on PyPI"
          for i in $(seq 1 30); do
            if curl -fs "https://pypi.org/pypi/darwin-memo/${VERSION}/json" > /dev/null; then
              echo "found after ${i} attempt(s)"
              exit 0
            fi
            sleep 30
          done
          echo "darwin-memo $VERSION never appeared on PyPI" >&2
          exit 1
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc
      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
