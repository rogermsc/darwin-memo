name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,mcp]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - name: Build and validate the package
        run: |
          pipx run build
          pipx run twine check --strict dist/*

  windows:
    # pyproject claims "Operating System :: OS Independent" and nothing has
    # ever checked it: every job here is ubuntu. The store's advisory lock
    # degrades to a no-op without fcntl, which is documented and deliberate,
    # but whether the package and its suite actually RUN on Windows was an
    # untested claim of the same kind this repo keeps finding. One version,
    # not the matrix: this asks "does it work at all", not "does it work
    # everywhere".
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,mcp]"
      - run: pytest -q -p no:cacheprovider

  paper:
    # The build guard has never run. tests/test_paper_builds_clean.py skips
    # without tectonic, and no job installed it, so the one check that
    # compiles the paper measured nothing on every push since it was written
    # -- while its own file carries a comment saying a guard that cannot run
    # in CI is not a guard. The ref and cite halves are covered without a
    # toolchain in the test job; this covers the half that needs one, and
    # publishes the PDF nobody could otherwise see.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Install tectonic
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tectonic
      - run: tectonic --version
      - name: The paper must build with no undefined references
        run: pytest -q tests/test_paper_builds_clean.py
      - name: Build the PDF
        run: tectonic --keep-logs --outdir "${RUNNER_TEMP:-/tmp}" paper/main.tex
      - uses: actions/upload-artifact@v4
        with:
          name: paper
          path: ${{ runner.temp }}/main.pdf
          if-no-files-found: error

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
        with:
          # The manifest's source_commit tests resolve commits against history,
          # and checkout's default depth of 1 makes them skip -- which is how a
          # reachability guard sat in CI while four entries named commits that
          # do not exist. This repo has been burned by a skipping guard before
          # (the paper build guard needs tectonic and CI has none), so the rule
          # is: a guard that cannot run in CI is not a guard.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev,mcp]"
      - run: pytest -q --cov --cov-fail-under=80
      - name: Smoke-test the offline examples
        run: |
          cd examples
          for ex in 0*.py; do python "$ex" > /dev/null; done
      - name: Benchmark smoke suite
        # Written outside bench/results/ on purpose: that directory holds
        # committed evidence, and a generated file sitting in it would
        # have to be special-cased by every check that walks it.
        run: |
          python -m bench.run --suite smoke --out "${RUNNER_TEMP:-/tmp}/smoke.json"
          python -m bench.report "${RUNNER_TEMP:-/tmp}/smoke.json" --check
      - name: The paper's figures must match the runs they are drawn from
        # A hand-edited coordinate is a number in the paper that does not trace
        # to committed evidence, which is the failure every other guard here
        # exists to prevent. Cheap, deterministic, no model.
        run: python -m bench.figures --check
      - name: Validate committed benchmark results against their manifest
        # The LLM suite itself NEVER runs in CI (sampled model output is
        # not deterministic); CI only validates the committed evidence.
        #
        # Globbed, not listed. A hardcoded list here validated 10 of 17
        # committed files and passed, and the 7 it skipped included the
        # two that could not pass at all -- the coverage had been shaped
        # around what worked. A glob verifies a new result file by
        # default and fails loudly on a broken one.
        run: |
          shopt -s nullglob
          for f in bench/results/*.json \
                   bench/results/swebench_cl/*.json \
                   bench/results/swebench_cl_long/*.json \
                   bench/results/swebench_cl_adversary/*.json; do
            [ "$(basename "$f")" = MANIFEST.json ] && continue
            python -m bench.report "$f" --check --require-manifest
          done
