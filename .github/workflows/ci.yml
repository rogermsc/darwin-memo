name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,mcp]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - name: Build and validate the package
        run: |
          pipx run build
          pipx run twine check --strict dist/*

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6
        with:
          # The manifest's source_commit tests resolve commits against history,
          # and checkout's default depth of 1 makes them skip -- which is how a
          # reachability guard sat in CI while four entries named commits that
          # do not exist. This repo has been burned by a skipping guard before
          # (the paper build guard needs tectonic and CI has none), so the rule
          # is: a guard that cannot run in CI is not a guard.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev,mcp]"
      - run: pytest -q --cov --cov-fail-under=80
      - name: Smoke-test the offline examples
        run: |
          cd examples
          for ex in 0*.py; do python "$ex" > /dev/null; done
      - name: Benchmark smoke suite
        # Written outside bench/results/ on purpose: that directory holds
        # committed evidence, and a generated file sitting in it would
        # have to be special-cased by every check that walks it.
        run: |
          python -m bench.run --suite smoke --out "${RUNNER_TEMP:-/tmp}/smoke.json"
          python -m bench.report "${RUNNER_TEMP:-/tmp}/smoke.json" --check
      - name: Validate committed benchmark results against their manifest
        # The LLM suite itself NEVER runs in CI (sampled model output is
        # not deterministic); CI only validates the committed evidence.
        #
        # Globbed, not listed. A hardcoded list here validated 10 of 17
        # committed files and passed, and the 7 it skipped included the
        # two that could not pass at all -- the coverage had been shaped
        # around what worked. A glob verifies a new result file by
        # default and fails loudly on a broken one.
        run: |
          shopt -s nullglob
          for f in bench/results/*.json \
                   bench/results/swebench_cl/*.json \
                   bench/results/swebench_cl_long/*.json \
                   bench/results/swebench_cl_adversary/*.json; do
            [ "$(basename "$f")" = MANIFEST.json ] && continue
            python -m bench.report "$f" --check --require-manifest
          done
