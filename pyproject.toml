[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "darwin-memo"
dynamic = ["version"]
description = "Self-curating memory for LLM agents: MeMo-style external memory kept honest by survival-based selection instead of reward models or judges."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Roger Simoes" }]
keywords = [
    "llm",
    "memory",
    "agents",
    "agent-memory",
    "self-training",
    "selection",
    "survival",
    "memo",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.50"]
embeddings = ["sentence-transformers>=3"]
# Floor verified empirically: 1.10.0 is the oldest release with both the
# FastMCP `instructions` parameter and the (blocks, structured) call_tool
# return shape the server and tests rely on.
mcp = ["mcp>=1.10"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.8",
    "mypy>=1.13",
    "hypothesis>=6",
]

[project.scripts]
darwin-memo = "darwin_memo.cli:main"
darwin-memo-mcp = "darwin_memo.mcp_server:main"

[project.urls]
Homepage = "https://github.com/rogermsc/darwin-memo"
Documentation = "https://github.com/rogermsc/darwin-memo/blob/main/docs/paper-to-code.md"
Changelog = "https://github.com/rogermsc/darwin-memo/blob/main/CHANGELOG.md"
Issues = "https://github.com/rogermsc/darwin-memo/issues"

[tool.setuptools.dynamic]
version = { attr = "darwin_memo.__version__" }

[tool.setuptools.packages.find]
include = ["darwin_memo*"]

[tool.setuptools.package-data]
darwin_memo = ["py.typed", "data/demo_corpus/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["darwin_memo"]

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["training"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["darwin_memo", "tests"]

[[tool.mypy.overrides]]
module = [
    "anthropic", "anthropic.*",
    "openai", "openai.*",
    "sentence_transformers", "sentence_transformers.*",
    "mcp", "mcp.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_calls = false

# When the [mcp] extra is absent, FastMCP resolves as Any and its tool
# decorator cascades untyped-decorator errors; relax just this module so
# contributors without the extra still get a clean strict run.
[[tool.mypy.overrides]]
module = "darwin_memo.mcp_server"
disallow_untyped_decorators = false
