[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "darwin-memo"
version = "0.1.0"
description = "Self-curating memory for LLM agents: MeMo-style external memory kept honest by survival-based selection instead of reward models or judges."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Roger Simoes" }]
keywords = ["llm", "memory", "agents", "self-training", "selection", "memo"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.50"]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/rogermsc/darwin-memo"
Issues = "https://github.com/rogermsc/darwin-memo/issues"

[tool.setuptools.packages.find]
include = ["darwin_memo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
